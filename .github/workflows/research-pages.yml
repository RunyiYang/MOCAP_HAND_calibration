name: Research project Pages
on:
  push:
    branches: [main]
    paths:
      - docs/index.html
      - docs/research/**
      - .github/workflows/research-pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble allow-listed research site
        run: |
          mkdir -p _site/research
          cp docs/index.html _site/index.html
          cp docs/research/*.md _site/research/
          cp docs/research/*.yaml _site/research/
          touch _site/.nojekyll
          test -s _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy research site
        id: deployment
        uses: actions/deploy-pages@v4
